[package]
name = "tumul"
version = "0.1.0"
edition = "2024"
authors = ["Alberto Colombo <albx79@gmail.com>"]
description = "A minimal Tumul interpreter and parser in Rust"
license = "MIT"
readme = "README.md"

[dependencies]
pest = "2.8.6"
pest_derive = "2.8.6"
regex = "1.10"
log = "0.4.29"
env_logger = "0.11.10"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
